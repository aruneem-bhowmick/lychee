[project]
name = "lychee"
version = "0.1.0"
description = "AI-powered pull request reviewer that peels back your code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "PyGithub>=2.3.0",
    "PyYAML>=6.0",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-snapshot>=0.9.0",
    "mypy>=1.10.0",
    "ruff>=0.4.7",
    "black>=24.4.2",
    "types-PyYAML>=6.0.0",
    "pre-commit>=3.7.1",
    "PyYAML>=6.0",
    "anthropic>=0.28.0",
]

[project.scripts]
lychee = "lychee.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lychee"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/lychee", "scripts", "tests"]
ignore_missing_imports = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e' --cov=src/lychee --cov-report=term-missing --cov-fail-under=80"
markers = [
    "e2e: end-to-end tests that invoke the installed CLI via subprocess (excluded from the default run; use -m e2e to run them explicitly)",
]

[tool.coverage.run]
branch = true
source = ["src/lychee"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
